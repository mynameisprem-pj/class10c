<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher dashboard — Leave applications</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">
      <span class="seal">✦</span>
      <div>
        <p class="masthead-title">Teacher dashboard</p>
        <p class="masthead-sub">Class X &middot; Section C</p>
      </div>
    </div>
  </header>

  <main class="wizard">

    <!-- LOGIN -->
    <section class="panel active" id="loginPanel">
      <h1>Log in</h1>
      <p class="hint">Enter the password to view leave applications.</p>
      <label class="field full">
        <span>Password</span>
        <div class="password-wrap">
          <input type="password" id="passwordInput" autocomplete="current-password">
          <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password" aria-pressed="false">
            <svg id="eyeIconOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeIconClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c7 0 10.5 7 10.5 7a13.4 13.4 0 0 1-3.1 3.9M6.6 6.6C3.4 8.6 1.5 12 1.5 12s3.5 7 10.5 7a10.1 10.1 0 0 0 5.4-1.6"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          </button>
        </div>
      </label>
      <p class="error-text" id="loginError" hidden></p>
      <div class="actions">
        <button type="button" class="btn primary" id="loginBtn">Log in</button>
      </div>
    </section>

    <!-- DASHBOARD -->
    <section class="panel" id="dashboardPanel">
      <div class="dash-header">
        <h1>Applications</h1>
        <button type="button" class="btn ghost small" id="logoutBtn">Log out</button>
      </div>

      <div class="dash-toolbar">
        <button type="button" class="btn ghost small" id="refreshBtn">Refresh</button>
        <span class="dash-count" id="dashCount"></span>
      </div>

      <p class="hint" id="emptyState" hidden>No applications yet.</p>

      <div class="app-list" id="appList"></div>
    </section>

  </main>

  <div class="detail-modal" id="detailModal">
    <div class="detail-sheet">
      <button type="button" class="detail-close" id="detailClose" aria-label="Close">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <div class="lightbox" id="photoLightbox">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img id="lightboxImg" src="" alt="ID card photo, full view">
  </div>

  <script src="js/teacher.js"></script>
</body>
</html>
